<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor de Notícias</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>📰 Leitor de Notícias</h1>
    <div class="search-box">
      <input type="text" id="search" placeholder="Pesquisar notícias...">
      <button id="btnBuscar">Buscar</button>
    </div>
  </header>

  <main id="news-container">
    <!-- As notícias aparecerão aqui -->
    <p class="loading">Carregando notícias...</p>
  </main>

  <footer>
    <p>Desenvolvido por Ifraim Lopes © 2025</p>
  </footer>
</body>
</html>
